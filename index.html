<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreMap — 서울 큐레이션 상점 지도 (No-DB Vanilla JS)</title>
  <meta name="description" content="데이터베이스 없이 순수 바닐라 자바스크립트로 동작하는 카테고리별 서울 핫스팟 및 상점 큐레이션 지도 웹애플리케이션">

  <!-- Pretendard Modern Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Leaflet CSS for Map Rendering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-area">
      <div class="brand-logo-icon">S</div>
      <div class="brand-titles">
        <h1 class="brand-name">StoreMap</h1>
        <span class="brand-tagline">SEOUL CURATED SPOTS &middot; NO-DB VANILLA JS</span>
      </div>
    </div>

    <!-- Search & Region Filters -->
    <div class="header-controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="상점명, 주소, #태그 검색..." 
          autocomplete="off"
        />
        <button id="searchClearBtn" class="search-clear-btn" aria-label="검색어 지우기">&times;</button>
      </div>

      <select id="guSelect" class="filter-select" aria-label="지역(구) 선택">
        <option value="all">전체 지역 (서울)</option>
      </select>

      <div class="header-meta-badge">
        <span>⚡ Pure Vanilla JS</span>
      </div>
    </div>
  </header>

  <!-- Main Container (Sidebar + Interactive Map) -->
  <main class="main-container">
    
    <!-- Left Sidebar: Category Filters & Store Cards -->
    <aside class="sidebar">
      
      <!-- Category Chips Filter -->
      <nav class="category-bar-wrapper" aria-label="카테고리 필터">
        <div id="categoryChips" class="category-chips">
          <!-- Dynamically Rendered by UiService -->
        </div>
      </nav>

      <!-- List Header Summary & Sort -->
      <div class="list-summary-bar">
        <span id="summaryCount" class="summary-count">총 <span>0</span>개의 스팟</span>
        <select id="sortSelect" class="sort-select" aria-label="정렬 기준">
          <option value="rating">★ 평점 높은순</option>
          <option value="reviews">💬 리뷰 많은순</option>
          <option value="name">가나다순</option>
        </select>
      </div>

      <!-- Store Cards Container -->
      <section id="storeListContainer" class="store-list-container" aria-label="상점 목록">
        <!-- Dynamically Populated by UiService -->
      </section>

    </aside>

    <!-- Right Map Viewport -->
    <section class="map-container" aria-label="지도 영역">
      <div id="map"></div>

      <!-- Floating Controls -->
      <div class="map-floating-controls">
        <button id="btnResetView" class="map-control-btn" title="전체 서울 뷰 리셋" aria-label="전체 뷰 리셋">
          🎯
        </button>
        <button id="btnLocateMe" class="map-control-btn" title="현재 내 위치" aria-label="내 위치 찾기">
          🧭
        </button>
      </div>

      <!-- Map Legend Overlay -->
      <div class="map-legend">
        <div class="legend-title">Categories</div>
        <div class="legend-items">
          <div class="legend-item"><span class="legend-dot" style="background-color: var(--cat-dining);"></span>다이닝</div>
          <div class="legend-item"><span class="legend-dot" style="background-color: var(--cat-cafe);"></span>카페</div>
          <div class="legend-item"><span class="legend-dot" style="background-color: var(--cat-bar);"></span>와인바</div>
          <div class="legend-item"><span class="legend-dot" style="background-color: var(--cat-bakery);"></span>베이커리</div>
          <div class="legend-item"><span class="legend-dot" style="background-color: var(--cat-lifestyle);"></span>소품샵</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Store Detail Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div id="modalContent">
      <!-- Injected by UiService.openDetailModal() -->
    </div>
  </div>

  <!-- Leaflet JavaScript CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic Modules -->
  <script src="data/stores.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mapService.js"></script>
  <script src="js/filterService.js"></script>
  <script src="js/uiService.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
